<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Background Color Scraping</title>
    <style>
        .card { padding: 10px; margin: 5px; border-radius: 4px; }
        .red-bg { background-color: #ff4d4d; color: white; }
        .green-bg { background-color: #2ecc71; color: white; }
        .blue-bg { background-color: #3498db; color: white; }
    </style>
</head>
<body>
    <h2>Elements with Inline Style Colors</h2>
    <div id="inline-box">
        <p class="color-item" style="background-color: #ff5733;">Orange Box (#ff5733)</p>
        <p class="color-item" style="background-color: rgb(0, 128, 0);">Green Box (rgb(0, 128, 0))</p>
        <p class="color-item" style="background-color: yellow;">Yellow Box (yellow)</p>
    </div>

    <h2>Elements with CSS Class Colors</h2>
    <div id="class-box">
        <div class="card red-bg">Alert Red</div>
        <div class="card green-bg">Success Green</div>
        <div class="card blue-bg">Info Blue</div>
    </div>
</body>
</html>
